name: Publish 'latest' image

on:
  release:
    types:
      - 'created'

jobs:
  # A release builds from whatever commit its tag points at, and the repository ruleset only governs
  # pushes to refs/heads/main — so without this the release path reaches production without a pull
  # request, a review or a status check. Declaring the environment here is what makes the production
  # environment's protection rules apply to a release at all; the shared deployment job does not
  # declare one.
  verify-release-target:
    name: Verify the release targets main
    runs-on: ubuntu-latest
    environment: ${{ github.event.release.prerelease && 'dev' || 'prd' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail when the tagged commit is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release commit ${GITHUB_SHA} is not an ancestor of origin/main; refusing to publish."
            exit 1
          fi
          echo "Release commit ${GITHUB_SHA} is on main."

  social-service-ea-deployment:
    needs: [verify-release-target]
    uses: decentraland/platform-actions/.github/workflows/apps-docker-release.yml@main
    with:
      service-name: social-service-ea
      image-name: social-service-ea
      deployment-environment: prd
    secrets: inherit
