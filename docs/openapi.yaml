      summary: Get the private messages settings of other users
      description: Returns who can send private messages to each requested user, and whether each one is a friend of the authenticated user.
      security:
        - SignedFetch: []
      parameters:
        - name: addresses
          in: query
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              pattern: '^0x[a-fA-F0-9]{40}$'
          style: form
          explode: true
          description: Addresses to look up, at most 50 (e.g. `?addresses=0x0000000000000000000000000000000000000001&addresses=0x0000000000000000000000000000000000000002`)
      responses:
        '200':
          description: Private messages settings of the requested users
          content:
