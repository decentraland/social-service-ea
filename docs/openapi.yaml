            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities

  /v1/mutes:
    post:
      operationId: addUserMute
      summary: Mute a user
      description: |
        Mutes a user by adding a mute record. The muter is identified via Signed Fetch authentication.
        Muting yourself returns a 400 error. Muting an already-muted user is idempotent (returns 204).
      security:
        - SignedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - muted_address
              properties:
                muted_address:
                  type: string
                  description: Ethereum address of the user to mute
                  example: '0x0000000000000000000000000000000000000001'
      responses:
        '204':
          description: User muted successfully
        '400':
          description: Invalid request (invalid address, self-mute, or missing authentication)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - User Mutes

    delete:
      operationId: removeUserMute
      summary: Unmute a user
      description: |
        Removes a mute record for a user. The muter is identified via Signed Fetch authentication.
        Unmuting a user that is not muted is a no-op (returns 204).
      security:
        - SignedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - muted_address
              properties:
                muted_address:
                  type: string
                  description: Ethereum address of the user to unmute
                  example: '0x0000000000000000000000000000000000000001'
      responses:
        '204':
          description: User unmuted successfully
        '400':
          description: Invalid request (invalid address or missing authentication)
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - User Mutes

    get:
      operationId: getUserMutes
      summary: Get muted users
      description: |
        Returns a paginated list of users muted by the authenticated user.
        Supports filtering by a single address or multiple addresses.
      security:
        - SignedFetch: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of results per page Values above the maximum are reduced to it.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
          description: Number of results to skip Values above the maximum are capped rather than rejected, so paging past it returns the last page again.
        - name: address
          in: query
          schema:
            type: string
          description: Filter by a single muted address
        - name: addresses
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by multiple muted addresses (e.g. `?addresses=0x1&addresses=0x2`)
      responses:
        '200':
          description: List of muted users
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetUserMutes200OkResponse'
        '400':
          description: Missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - User Mutes

  /v2/friends:
    get:
      operationId: getFriendsV2
      summary: Get friends (addresses only)
      description: |
        Returns a paginated list of the addresses of the authenticated user's friends. The response has no
        profile information: clients resolve the profiles themselves.
      security:
        - SignedFetch: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Number of results per page. Values above the maximum are reduced to it.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip. Values above 100000 are clamped to 100000.
      responses:
        '200':
          description: Friends of the authenticated user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetFriends200OkResponse'
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Friends

  /v1/friends/{address}:
    delete:
      operationId: removeFriend
      summary: Remove a friend
      description: Ends the friendship between the authenticated user and `address`.
      security:
        - SignedFetch: []
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Ethereum address of the other user
      responses:
        '204':
          description: Friendship ended
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: One of the users blocked the other
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '409':
          description: The action is not valid for the current friendship status
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: Too many friendship or block actions, try again later
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Friends

