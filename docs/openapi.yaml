  /v1/users/{address}/friendship-status:
    get:
      operationId: getFriendshipStatus
      summary: Get the friendship status with a user
      description: Returns the status of the friendship between the authenticated user and `address`.
      security:
        - SignedFetch: []
      parameters:
        - name: address
          in: path
          required: true
          schema:
