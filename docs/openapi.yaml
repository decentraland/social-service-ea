  /v2/communities:
    get:
      operationId: listCommunitiesV2
      summary: List communities (v2, address-only)
      description: |
        Same as GET /v1/communities but the response contains only addresses: the owner
        address (no owner name) and mutual-friend addresses (string[]) instead of friend
        profiles.

        **Minimal Mode (minimal=true):**
        Identical to v1, and subject to the same requirements: authentication is required,
        `search` is required with a minimum of 3 characters, and only `search` is honoured —
        `onlyMemberOf`, `onlyWithActiveVoiceChat` and `roles` are ignored. A request with
        `minimal=true` and no search term, or one shorter than 3 characters, is rejected with
        400; without authentication, 401. Results exclude communities the caller is banned
        from, and `total` excludes them too.
      security:
        - SignedFetch: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter communities by name. Required when `minimal=true` (minimum 3 characters).
        - name: onlyMemberOf
          in: query
          required: false
          schema:
            type: boolean
        - name: onlyWithActiveVoiceChat
          in: query
          required: false
          schema:
            type: boolean
          description: Filter to show only communities with active voice chats. Ignored when `minimal=true`.
        - name: minimal
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When `true`, returns only `id`, `name`, `membersCount`, and `privacy` for fast lookups.
            Requires authentication and a `search` parameter with at least 3 characters.
            Supports pagination with `limit` (max 50) and `offset`. Other filters
            (`onlyMemberOf`, `onlyWithActiveVoiceChat`, `roles`) are ignored.
        - name: roles
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [owner, moderator, member, none]
          description: Filter communities by the authenticated user's role (can specify multiple). Ignored when `minimal=true`.
      responses:
        '200':
          description: Communities found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetCommunitiesV2200OkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - authentication is required when `minimal=true`
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities v2

  /v2/communities/{id}:
    get:
      operationId: getCommunityByIdV2
      summary: Get community by ID (v2, address-only)
      description: |
        Same as GET /v1/communities/{id} but the response contains only the owner address
        (no owner name). Never fails when the owner profile cannot be resolved.
      security:
        - SignedFetch: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the community.
      responses:
        '200':
          description: Community found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetCommunityByIdV2200OkResponse'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
