        - Private Voice Chats

  /v1/private-voice-chats/{callId}:
    patch:
      operationId: updatePrivateVoiceChat
      summary: Accept or reject a private voice chat
      description: |
        The callee accepts the call, getting the credentials to join it (200), or rejects it (204). Only the
        callee can do either.
      security:
        - SignedFetch: []
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
