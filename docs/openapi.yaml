        blocked. The response has no profile information: clients resolve the profiles themselves.
      security:
        - SignedFetch: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Number of results per page. Values above the maximum are reduced to it.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip. Values above 100000 are clamped to 100000.
      responses:
        '200':
          description: Users blocked by the authenticated user
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetBlockedUsers200OkResponse'
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Blocks

  /v1/blocks:
    post:
      operationId: blockUser
      summary: Block a user
      description: |
        Blocks `address` for the authenticated user. Blocking a friend also ends the friendship. Blocking
        an address that is already blocked keeps the original `blockedAt`.
      security:
        - SignedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              additionalProperties: false
              properties:
                address:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: Ethereum address of the user to block
                  example: '0x0000000000000000000000000000000000000001'
      responses:
        '201':
          description: User blocked, with the blocked address and when it was blocked
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/BlockUser201OkResponse'
        '400':
          description: Invalid request or missing authentication, including an attempt to block yourself
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: Too many friendship or block actions, try again later
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Blocks

  /v1/blocks/{address}:
    delete:
      operationId: unblockUser
      summary: Unblock a user
      description: Removes the block the authenticated user placed on `address`. Does nothing if that block does not exist.
      security:
        - SignedFetch: []
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: Ethereum address of the other user
      responses:
        '204':
          description: User unblocked
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: Too many friendship or block actions, try again later
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Blocks

  /v1/blocking-status:
