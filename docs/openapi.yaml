          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetCommunityRequestsV2200OkResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities v2

  /v2/members/{address}/requests:
    get:
      operationId: getMemberRequestsV2
      summary: Get member requests (v2, address-only)
      description: |
        Same as GET /v1/members/{address}/requests but each request's community carries the
        owner address (no owner name) and mutual-friend addresses (string[]).
      security:
        - SignedFetch: []
      parameters:
        - name: address
          in: path
