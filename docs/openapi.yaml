    delete:
      operationId: removeCommunityVoiceChatSpeakRequest
      summary: Lower the hand or reject a speak request
      description: |
        On the authenticated user's own address it lowers their hand. On someone else's it rejects their
        request, which only owners and moderators can do. Lowering one's own hand is idempotent and
        returns 204 even if the room or participant is already gone.
      security:
        - SignedFetch: []
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the community
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Ethereum address of the other user
      responses:
        '204':
          description: Speak request removed
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
