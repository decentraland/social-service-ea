            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities v2

  /v2/communities/{id}/requests:
    get:
      operationId: getCommunityRequestsV2
      summary: Get community requests (v2, address-only)
      description: |
        Same as GET /v1/communities/{id}/requests but returns the requesting member
