        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Friends

  /v2/friendship-requests:
    get:
      operationId: getFriendshipRequestsV2
      summary: Get pending friendship requests (addresses only)
      description: |
        Returns a paginated list of the pending friendship requests the authenticated user received or sent.
        Each request carries the other user's address instead of their profile.
      security:
        - SignedFetch: []
      parameters:
        - name: direction
          in: query
          required: true
          schema:
            type: string
            enum: [received, sent]
          description: Whether to list the requests the user received or the ones they sent
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Number of results per page. Values above the maximum are reduced to it.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip. Values above 100000 are clamped to 100000.
      responses:
        '200':
          description: Pending friendship requests
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetFriendshipRequests200OkResponse'
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Friends

  /v1/friendship-requests:
    post:
      operationId: createFriendshipRequest
      summary: Send a friendship request
      description: Sends a friendship request from the authenticated user to `address`.
      security:
        - SignedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
                  description: Ethereum address of the user to send the request to
                  example: '0x0000000000000000000000000000000000000001'
                message:
                  type: string
                  maxLength: 256
                  description: Optional message sent along with the request, limited to 256 Unicode code points
      responses:
        '201':
          description: Friendship request sent, with the receiver's address
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/FriendshipRequest200OkResponse'
        '400':
          description: >-
            Invalid request or missing authentication: invalid address, a request to yourself or a message
            longer than 256 characters
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: One of the users blocked the other
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '409':
          description: The action is not valid for the current friendship status
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: Too many friendship or block actions, try again later
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Friends

  /v1/friendship-requests/{address}:
    patch:
      operationId: updateFriendshipRequest
      summary: Accept, reject or cancel a friendship request
      description: |
        Resolves the pending friendship request between the authenticated user and `address`. There is at
        most one pending request per pair of users, so the other user's address identifies it. The receiver
        can accept or reject it, and the sender can cancel it.
      security:
        - SignedFetch: []
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
          description: Ethereum address of the other user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intention
              properties:
                intention:
                  type: string
                  enum: [accepted, rejected, cancelled]
      responses:
        '200':
          description: Friendship request updated, with the other user's address
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/FriendshipRequest200OkResponse'
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: One of the users blocked the other
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '409':
          description: The action is not valid for the current friendship status
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '429':
          description: Too many friendship or block actions, try again later
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Friends

  /v2/blocks:
