      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - intention
              properties:
                intention:
                  type: string
                  enum: [accepted, rejected]
      responses:
        '200':
          description: Call accepted
          content:
            application/json:
              schema:
