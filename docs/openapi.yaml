          description: Ethereum address of the other user
      responses:
        '200':
          description: Friendship status
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetFriendshipStatus200OkResponse'
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
