              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated user is not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Private Voice Chats

    delete:
      operationId: endPrivateVoiceChat
      summary: End a private voice chat
      description: Ends the call, or cancels it before it is accepted. Either participant can do it.
      security:
        - SignedFetch: []
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the private voice chat
      responses:
        '204':
          description: Call ended
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Private Voice Chats

