  /v1/private-voice-chats:
    post:
      operationId: startPrivateVoiceChat
      summary: Start a private voice chat
      description: |
        Calls `calleeAddress`. Fails with 403 when either user only accepts calls from friends and they are not
        friends, or one blocked the other, and with 409 when either user is already in, or being invited to,
        another private or community voice chat.
      security:
        - SignedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - calleeAddress
              properties:
                calleeAddress:
                  type: string
                  example: '0x0000000000000000000000000000000000000001'
      responses:
        '201':
          description: Call started
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/StartPrivateVoiceChat201OkResponse'
        '400':
          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated user is not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '409':
          description: The action conflicts with the current state
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Private Voice Chats

  /v1/private-voice-chats/incoming:
