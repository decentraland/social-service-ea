      operationId: getActiveCommunityVoiceChats
      summary: Get active community voice chats
      description: |
        Lists all active community voice chats visible to the authenticated user.
        This endpoint requires Signed Fetch authentication.
        Returns voice chats from communities the user is a member of, including participant counts,
        moderator counts, community information, and location data (positions and worlds).
      security:
        - SignedFetch: []
      responses:
        '200':
          description: Active community voice chats found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetActiveCommunityVoiceChats200OkResponse'
        '401':
          description: Unauthorized - Signed Fetch required
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Community Voice Chats

  /v1/moderation/communities:
    get:
      operationId: getCommunitiesForModeration
      summary: Get all communities for moderation
      description: |
        Lists all communities for moderation purposes with detailed information.
        This endpoint requires Signed Fetch authentication and the user must be a global moderator.
        Global moderators are configured via feature flags.
      security:
        - SignedFetch: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of communities per page. Values above the maximum are reduced to it.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
          description: Number of communities to skip. Values above the maximum are capped rather than rejected, so paging past it returns the last page again.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter communities by name or description.
      responses:
        '200':
          description: Communities found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetCommunitiesForModeration200OkResponse'
        '403':
          description: Forbidden - Global moderator privileges required
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Signed Fetch required
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities

  /v1/communities/{id}/posts:
    get:
      operationId: listCommunityPosts
      summary: List community posts
      description: |
        Lists all posts from a specific community with pagination support.
        This endpoint has optional Signed Fetch authentication.
        When not signed, it only returns posts from public communities.
        When signed, it returns all posts if the user has access to the community, including the user's like status for each post.
        Posts are returned in reverse chronological order (newest first).
      security:
        - SignedFetch: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the community.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Number of posts per page (max 100). Values above the maximum are reduced to it.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
          description: Number of posts to skip. Values above the maximum are capped rather than rejected, so paging past it returns the last page again.
      responses:
        '200':
          description: Posts found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/GetCommunityPosts200OkResponse'
        '401':
          description: Unauthorized - Signed Fetch required
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities
    post:
      operationId: createCommunityPost
      summary: Create a community post
      description: |
        Creates a new post in a community.
        This endpoint requires Signed Fetch authentication and only community owners or moderators can create posts.
        Post content must be between 1 and 1000 characters.
        Returns the created post with author profile information.
      security:
        - SignedFetch: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the community.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/CreatePost201OkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Signed Fetch required or insufficient permissions
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Communities

  /v1/communities/{id}/posts/{postId}:
    delete:
      operationId: deleteCommunityPost
