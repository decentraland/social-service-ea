          description: Invalid request or missing authentication
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/components/schemas/ErrorResponse'
      tags:
        - Social Settings

    patch:
      operationId: updateSocialSettings
      summary: Update the social settings
      description: |
        Updates the submitted social settings of the authenticated user and returns all of them. At least one
        setting must be submitted. The private messages privacy is also synced to Comms Gatekeeper; if that
        fails the request answers 500, and a restriction to `only_friends` is not stored.
      security:
        - SignedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                privateMessagesPrivacy:
                  type: string
                  enum: [all, only_friends]
                blockedUsersMessagesVisibility:
                  type: string
